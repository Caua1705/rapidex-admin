name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch: não adianta
# esperar o CI de um commit que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` e não `npm install`: instala exatamente o que está no
      # package-lock.json, então o CI testa as mesmas versões da sua máquina.
      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run e2e:install

      # O E2E não chama a API real: e2e/fake-api.ts intercepta tudo. Por isso
      # o CI fica verde mesmo com o backend fora do ar.
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
