<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      DUAS LETRAS, E CADA UMA COM UM TRABALHO.

      SPACE GROTESK na interface. Grotesca com terminais cortados na diagonal e
      aberturas fechadas — ela tem desenho próprio, ao contrário da Inter, que
      é justamente uma neo-grotesca sem opinião. É o que dá à tela o ar de
      placa de equipamento em vez de dashboard de qualquer coisa.

      JETBRAINS MONO no número, e SÓ em três lugares: tempo decorrido, dinheiro
      e nº de pedido. É a letra da comanda térmica e do display do forno, e a
      continuidade entre a tela e o papel é o que faz o balcão e a cozinha
      falarem do mesmo pedido. Fora desses três, mono vira estética de terminal
      e o painel deixa de ler — ver o bloco do número em styles/typography.css.

      Vem por <link> e não por @import no CSS porque @import serializa o
      download atrás da folha de estilo; os fallbacks de sistema em `--font-ui`
      seguram o painel enquanto elas não chegam.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
    />

    <title>Rapidex — Painel do lojista</title>

    <script>
      /*
       * Tema antes do primeiro pixel.
       *
       * Se isto esperasse o React, quem usa o tema escuro veria um quadro
       * branco a cada F5 — e num painel que fica aberto o dia todo esse flash é
       * a primeira coisa que se nota.
       *
       * A REGRA É A MESMA de src/theme/theme.ts, e precisa continuar sendo: a
       * escolha guardada ganha do sistema, o sistema ganha do padrão. Duas
       * regras diferentes aqui e lá é como o flash volta.
       */
      (function () {
        var escolha = null;
        try {
          escolha = localStorage.getItem('rapidex-admin.theme');
        } catch (_) {
          /* localStorage bloqueado: sobra a preferência do sistema. */
        }
        var tema =
          escolha === 'dark' || escolha === 'light'
            ? escolha
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', tema);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
