<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` É O QUE LIGA A SAFE-AREA, e sem ele o resto é
      decoração.

      O painel já pedia `env(safe-area-inset-bottom)` em quatro lugares — a
      barra de baixo, a folha do "Mais", a coluna de Minha loja e o rodapé do
      detalhe do pedido, que é onde mora "Aceitar pedido". Só que no iOS essas
      variáveis valem ZERO enquanto a página não declara que quer desenhar sob
      o notch e sob a barra de gestos: sem `viewport-fit=cover` o Safari
      encolhe o viewport até a área segura e responde 0 para todas elas.

      Ou seja: o código do respiro estava escrito e inerte, e "Aceitar pedido"
      terminava exatamente na borda de baixo da tela — em cima da barra de
      gestos do iPhone. Esta linha é o que faz os quatro `env()` existentes
      passarem a valer.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      UMA LETRA SÓ, EM TODA A TELA.

      IBM PLEX SANS na interface. Ela substituiu a Inter na direção "Refinada":
      a Inter é a neo-grotesca neutra por definição — não tem defeito e não tem
      voz —, e a Plex tem osso de grotesca de engenharia sem virar sotaque. É
      ela que faz a mesma escala ler como INSTRUMENTO em vez de aplicação de
      administração genérica. Autohospedada via
      @fontsource-variable/ibm-plex-sans (importada em src/main.tsx), sem CDN:
      nenhum <link> de fonte aqui.
    -->

    <title>Rapidex — Painel do lojista</title>

    <script>
      /*
       * Tema antes do primeiro pixel.
       *
       * Se isto esperasse o React, quem usa o tema escuro veria um quadro
       * branco a cada F5 — e num painel que fica aberto o dia todo esse flash é
       * a primeira coisa que se nota.
       *
       * A REGRA É A MESMA de src/theme/theme.ts, e precisa continuar sendo: a
       * escolha guardada ganha do sistema, o sistema ganha do padrão. Duas
       * regras diferentes aqui e lá é como o flash volta.
       */
      (function () {
        var escolha = null;
        try {
          escolha = localStorage.getItem('rapidex-admin.theme');
        } catch (_) {
          /* localStorage bloqueado: sobra a preferência do sistema. */
        }
        var tema =
          escolha === 'dark' || escolha === 'light'
            ? escolha
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', tema);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
