<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      INTER, E SÓ ELA.

      É uma sans neutra de interface: sem personalidade própria, com métricas
      pensadas para texto pequeno em tela e — o que decide aqui — numerais
      tabulares de verdade. Painel de operação é uma tela cheia de número que
      precisa alinhar em coluna: preço, tempo decorrido, nº de pedido.

      A anterior (Archivo) era arredondada e macia; ela dá à tela um tom
      simpático que atrapalha quem está tentando ver quantos pedidos estão
      atrasados. E a mono (JetBrains) saiu junto: preço em monoespaçada lê como
      trecho de código no meio do cardápio, e o alinhamento que ela existia
      para resolver o `tnum` da Inter já resolve.

      Vem por <link> e não por @import no CSS porque @import serializa o
      download atrás da folha de estilo; os fallbacks de sistema em `--font-ui`
      seguram o painel enquanto ela não chega.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
    />

    <title>Rapidex — Painel do lojista</title>

    <script>
      /*
       * Tema antes do primeiro pixel.
       *
       * Se isto esperasse o React, quem usa o tema escuro veria um quadro
       * branco a cada F5 — e num painel que fica aberto o dia todo esse flash é
       * a primeira coisa que se nota.
       *
       * A REGRA É A MESMA de src/theme/theme.ts, e precisa continuar sendo: a
       * escolha guardada ganha do sistema, o sistema ganha do padrão. Duas
       * regras diferentes aqui e lá é como o flash volta.
       */
      (function () {
        var escolha = null;
        try {
          escolha = localStorage.getItem('rapidex-admin.theme');
        } catch (_) {
          /* localStorage bloqueado: sobra a preferência do sistema. */
        }
        var tema =
          escolha === 'dark' || escolha === 'light'
            ? escolha
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', tema);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
